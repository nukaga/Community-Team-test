name: Create Sub-Issues for Monthly Meeting
on:
  issues:
    types: [opened]

jobs:
  create-sub-issues:
    if: contains(github.event.issue.labels.*.name, '[Admin] Team Meeting')
    runs-on: ubuntu-latest
    steps:
      - name: Create sub-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 親Issueの情報を取得
          PARENT_ISSUE_NUMBER=${{ github.event.issue.number }}
          PARENT_ISSUE_URL=${{ github.event.issue.html_url }}

          # 子Issueのリスト
TASKS: |
  - title: "Create and publish the team meeting agenda"
    body: |
      **Agenda template**  
      [Google Docs](https://docs.google.com/document/d/1TL4z0Z6L83jBbXhBIWPJ7b2FHYLyijXewXZ_BYMl33Q/edit?tab=t.0)  

      **Creating a new post**  
      [WordPress Community Post](https://make.wordpress.org/community/wp-admin/post-new.php)  

      **Parent Issue:** [#$PARENT_ISSUE_NUMBER]($PARENT_ISSUE_URL)

  - title: "Create the meeting script"
    body: |
      **Script template**  
      [Google Docs](https://docs.google.com/document/d/1zu_lWf150SJ6nVz7IG7_QhLYQbvOUQNBgQ_PU2c2q8A/edit?tab=t.0)  

      **Parent Issue:** [#$PARENT_ISSUE_NUMBER]($PARENT_ISSUE_URL)

  - title: "Host the meeting (1st session)"
    body: |
      **Hosts facilitate the sessions**  
      - Asia-Pacific / EMEA friendly meeting: at 12:00 PM UTC  
      - [#community-team](https://make.wordpress.org/chat/) channel on Slack  

      **Parent Issue:** [#$PARENT_ISSUE_NUMBER]($PARENT_ISSUE_URL)

  - title: "Host the meeting (2nd session)"
    body: |
      **Hosts facilitate the sessions**  
      - Americas friendly meeting: at 9:00 PM UTC  
      - [#community-team](https://make.wordpress.org/chat/) channel on Slack  

      **Parent Issue:** [#$PARENT_ISSUE_NUMBER]($PARENT_ISSUE_URL)

  - title: "Write the meeting recap"
    body: |
      **Recap template**  
      [Google Docs](https://docs.google.com/document/d/1fCPPQgE7anhrtgYnUnVWRnHMvLrmPtsIWUJh8I8CgRQ/edit?tab=t.0#heading=h.dqymfbg7mc8a)  

      **Creating a new post**  
      [WordPress Community Post](https://make.wordpress.org/community/wp-admin/post-new.php)  

      **Parent Issue:** [#$PARENT_ISSUE_NUMBER]($PARENT_ISSUE_URL)

          for TASK in "${TASKS[@]}"; do
            TITLE=$(echo "$TASK" | cut -d '|' -f 1)
            BODY=$(echo "$TASK" | cut -d '|' -f 2)

            gh issue create \
              --title "[Meeting Task] $TITLE" \
              --body "$BODY" \
              --label "[Admin] Team Meeting" \
              --repo $GITHUB_REPOSITORY
          done
